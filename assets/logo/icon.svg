<svg width='512' height='512' viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'>
  <defs>
    <linearGradient id='camBody' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#1a1a2e'/>
      <stop offset='100%' stop-color='#16213e'/>
    </linearGradient>
    <linearGradient id='lens' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#22c55e'/>
      <stop offset='50%' stop-color='#16a34a'/>
      <stop offset='100%' stop-color='#166534'/>
    </linearGradient>
    <linearGradient id='petal1' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#4ade80'/>
      <stop offset='100%' stop-color='#22c55e'/>
    </linearGradient>
    <linearGradient id='petal2' x1='0%' y1='100%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#86efac'/>
      <stop offset='100%' stop-color='#4ade80'/>
    </linearGradient>
    <filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='4' stdDeviation='8' flood-color='rgba(0,0,0,0.4)'/>
    </filter>
    <filter id='glow'>
      <feGaussianBlur stdDeviation='4' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
    <clipPath id='camClip'>
      <rect width='512' height='512' rx='96'/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width='512' height='512' rx='96' fill='url(#camBody)'/>

  <!-- Camera body highlight -->
  <rect x='40' y='120' width='432' height='310' rx='28' fill='#1e293b' opacity='0.6'/>
  <rect x='40' y='120' width='432' height='310' rx='28' fill='none' stroke='#34d399' stroke-width='1.5' opacity='0.3'/>

  <!-- Camera viewfinder bump -->
  <rect x='170' y='80' width='172' height='60' rx='16' fill='#1e293b'/>
  <rect x='170' y='80' width='172' height='60' rx='16' fill='none' stroke='#34d399' stroke-width='1' opacity='0.3'/>

  <!-- Flash dot -->
  <circle cx='110' cy='162' r='18' fill='#1e293b' stroke='#34d399' stroke-width='1.5' opacity='0.7'/>
  <circle cx='110' cy='162' r='8' fill='#fbbf24' opacity='0.9'/>

  <!-- Lens outer ring -->
  <circle cx='256' cy='285' r='148' fill='#1e293b' filter='url(#shadow)'/>
  <circle cx='256' cy='285' r='148' fill='none' stroke='#34d399' stroke-width='3' opacity='0.5'/>
  <circle cx='256' cy='285' r='138' fill='none' stroke='#34d399' stroke-width='1' opacity='0.2'/>

  <!-- Lens glass -->
  <circle cx='256' cy='285' r='124' fill='url(#lens)' opacity='0.15'/>

  <!-- Flower petals (inside lens) -->
  <!-- Top petal -->
  <ellipse cx='256' cy='222' rx='26' ry='42' fill='url(#petal1)' opacity='0.95' filter='url(#glow)'/>
  <!-- Top-right petal -->
  <ellipse cx='256' cy='222' rx='26' ry='42' fill='url(#petal2)' opacity='0.9'
    transform='rotate(51 256 285)'/>
  <!-- Right petal -->
  <ellipse cx='256' cy='222' rx='26' ry='42' fill='url(#petal1)' opacity='0.9'
    transform='rotate(102 256 285)'/>
  <!-- Bottom-right petal -->
  <ellipse cx='256' cy='222' rx='26' ry='42' fill='url(#petal2)' opacity='0.9'
    transform='rotate(153 256 285)'/>
  <!-- Bottom petal -->
  <ellipse cx='256' cy='222' rx='26' ry='42' fill='url(#petal1)' opacity='0.9'
    transform='rotate(204 256 285)'/>
  <!-- Bottom-left petal -->
  <ellipse cx='256' cy='222' rx='26' ry='42' fill='url(#petal2)' opacity='0.9'
    transform='rotate(255 256 285)'/>
  <!-- Left petal -->
  <ellipse cx='256' cy='222' rx='26' ry='42' fill='url(#petal1)' opacity='0.9'
    transform='rotate(306 256 285)'/>

  <!-- Flower center -->
  <circle cx='256' cy='285' r='34' fill='#052e16'/>
  <circle cx='256' cy='285' r='28' fill='#166534'/>
  <circle cx='256' cy='285' r='20' fill='#22c55e'/>
  <circle cx='256' cy='285' r='10' fill='#4ade80' opacity='0.9' filter='url(#glow)'/>
  <circle cx='256' cy='285' r='4' fill='white' opacity='0.95'/>

  <!-- Lens aperture ring -->
  <circle cx='256' cy='285' r='122' fill='none' stroke='#34d399' stroke-width='2' opacity='0.4' stroke-dasharray='12 8'/>

  <!-- Corner scan brackets -->
  <path d='M64 152 L64 128 L88 128' fill='none' stroke='#34d399' stroke-width='3' stroke-linecap='round' opacity='0.7'/>
  <path d='M448 152 L448 128 L424 128' fill='none' stroke='#34d399' stroke-width='3' stroke-linecap='round' opacity='0.7'/>
  <path d='M64 418 L64 442 L88 442' fill='none' stroke='#34d399' stroke-width='3' stroke-linecap='round' opacity='0.7'/>
  <path d='M448 418 L448 442 L424 442' fill='none' stroke='#34d399' stroke-width='3' stroke-linecap='round' opacity='0.7'/>
</svg>