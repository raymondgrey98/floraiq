<svg width='512' height='512' viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'>
  <defs>
    <linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#16a34a'/>
      <stop offset='100%' stop-color='#22c55e'/>
    </linearGradient>
    <linearGradient id='lens' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#052e16'/>
      <stop offset='100%' stop-color='#064e2a'/>
    </linearGradient>
    <linearGradient id='petal' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#ffffff'/>
      <stop offset='100%' stop-color='#bbf7d0'/>
    </linearGradient>
    <filter id='shadow'>
      <feDropShadow dx='0' dy='3' stdDeviation='6' flood-color='rgba(0,0,0,0.25)'/>
    </filter>
  </defs>

  <!-- Bright green rounded background -->
  <rect width='512' height='512' rx='100' fill='url(#bg)'/>

  <!-- Camera body — white rounded rect -->
  <rect x='56' y='148' width='400' height='268' rx='32' fill='white' opacity='0.95' filter='url(#shadow)'/>

  <!-- Camera top bump (viewfinder) -->
  <rect x='176' y='112' width='160' height='56' rx='18' fill='white' opacity='0.95'/>

  <!-- Flash dot — yellow -->
  <circle cx='104' cy='192' r='20' fill='#fbbf24'/>
  <circle cx='104' cy='192' r='12' fill='#fde68a'/>

  <!-- Lens outer ring — dark green -->
  <circle cx='268' cy='292' r='122' fill='url(#lens)'/>
  <circle cx='268' cy='292' r='108' fill='#0a3d20'/>

  <!-- Flower petals — white/light green -->
  <ellipse cx='268' cy='228' rx='22' ry='38' fill='url(#petal)' opacity='0.95'/>
  <ellipse cx='268' cy='228' rx='22' ry='38' fill='url(#petal)' opacity='0.9' transform='rotate(51 268 292)'/>
  <ellipse cx='268' cy='228' rx='22' ry='38' fill='url(#petal)' opacity='0.9' transform='rotate(102 268 292)'/>
  <ellipse cx='268' cy='228' rx='22' ry='38' fill='url(#petal)' opacity='0.9' transform='rotate(153 268 292)'/>
  <ellipse cx='268' cy='228' rx='22' ry='38' fill='url(#petal)' opacity='0.9' transform='rotate(204 268 292)'/>
  <ellipse cx='268' cy='228' rx='22' ry='38' fill='url(#petal)' opacity='0.9' transform='rotate(255 268 292)'/>
  <ellipse cx='268' cy='228' rx='22' ry='38' fill='url(#petal)' opacity='0.9' transform='rotate(306 268 292)'/>

  <!-- Flower center -->
  <circle cx='268' cy='292' r='38' fill='#16a34a'/>
  <circle cx='268' cy='292' r='26' fill='#22c55e'/>
  <circle cx='268' cy='292' r='12' fill='#4ade80'/>
  <circle cx='268' cy='292' r='5' fill='white' opacity='0.95'/>

  <!-- Lens aperture ring -->
  <circle cx='268' cy='292' r='106' fill='none' stroke='white' stroke-width='3' opacity='0.25' stroke-dasharray='10 8'/>
</svg>