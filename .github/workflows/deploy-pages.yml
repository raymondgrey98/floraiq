# Automatic deployment — you never have to deploy by hand again.
#
# Every push to master rebuilds FloraIQ and publishes it to:
#   https://raymondgrey98.github.io/floraiq/
#
# ONE-TIME SETUP (2 clicks, only needed once):
#   Repo → Settings → Pages → under "Build and deployment",
#   set Source to "GitHub Actions".
#
# OPTIONAL — to make AI scanning work on the website:
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#   Name: VITE_GEMINI_API_KEY     Value: your Gemini key
#   (Without it the site still works: map, guides, garden, tools. Only the
#    photo-scanning needs the key. Note the key is visible to anyone who
#    inspects a public website — that is unavoidable for a static site.)

name: Deploy website

on:
  push:
    branches: [master]
  workflow_dispatch: # lets you trigger it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        env:
          # Assets must resolve under /floraiq/ on GitHub Pages
          VITE_BASE: /floraiq/
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: pnpm build

      - name: Add 404 fallback for client-side routing
        # GitHub Pages has no server, so deep links like /map need the SPA
        # entry point served for unknown paths.
        run: cp dist/public/index.html dist/public/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
